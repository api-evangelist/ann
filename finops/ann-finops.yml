specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
provider: ANN Inc.
providerId: ann
publisherName: Ann Taylor (operated by Sycamore Partners portfolio companies)
serviceCategory: Affiliate Marketing
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - FinOps
  - FOCUS
  - Affiliate Marketing
  - Retail
description: >-
  FOCUS-aligned FinOps placeholder for Ann Taylor's affiliate program. The
  cash flow is reverse-direction (publisher earns commission, not pays a
  fee); the publisher's FinOps cost surface is the affiliate-network platform
  fee plus revenue-share, not Ann Taylor's API.
notes: >-
  Affiliate revenue is not an API charge category in the conventional FinOps
  sense; it is a marketing channel commission settled via FlexOffers / CJ.
sources:
  - https://www.flexoffers.com/affiliate-programs/ann-taylor-affiliate-program/
billingModel:
  pricingCategory: Take Rate
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
    - Adjustment
    - Credit
focusColumns:
  ServiceName: Ann Taylor Affiliate Program
  ServiceCategory: Affiliate Marketing
  ProviderName: Ann Taylor
  PublisherName: Ann Taylor / Sycamore Partners
  InvoiceIssuerName: FlexOffers (or CJ Affiliate, depending on network)
  BillingCurrency: USD
meters:
  - name: attributed_sales
    description: Gross sales attributed via affiliate links
    unit: USD
    aggregation: sum
    dimensions:
      - publisher
      - sub_id
      - channel
  - name: commissions_earned
    description: Commission paid out to publisher (negative cost / revenue from FinOps view)
    unit: USD
    aggregation: sum
    dimensions:
      - publisher
      - period
  - name: clicks
    description: Affiliate link click volume
    unit: click
    aggregation: count
    dimensions:
      - publisher
      - link
principles:
  - name: Visibility
    description: >-
      Use the FlexOffers / CJ publisher dashboard for click, conversion, and
      payout reporting. Ann Taylor itself does not expose publisher-level
      telemetry.
  - name: Allocation
    description: >-
      Allocate affiliate revenue and any platform fees to the marketing
      sub-channel and content team that owns the link.
  - name: Optimization
    description: >-
      Optimization levers are creative selection, deep-link strategy, and
      catalog feed freshness; not request-rate tuning.
  - name: Accountability
    description: >-
      Marketing and content teams own this revenue line; finance / FinOps
      handles 1099 reconciliation through the network.
maintainers:
  - FN: API Evangelist
    email: info@apievangelist.com
