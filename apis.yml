  detail: >-
    ANN Inc. is a women's apparel retailer (Ann Taylor, LOFT) held by KnitWell Group under
    Sycamore Partners; its only programmable surface is an affiliate program whose link,
    feed and reporting APIs belong to FlexOffers and CJ Affiliate, and full STEP 0b
    contract discovery found no first-party spec — api.anntaylor.com and
    developer.anntaylor.com do not resolve at all, while www.anntaylor.com and www.loft.com
    are Salesforce Commerce Cloud storefronts that answer HTTP 200 with the same storefront
    shell for every path including /openapi.json, /graphql, /llms.txt and a control path
    that cannot exist.
