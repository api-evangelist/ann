specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: ANN Inc.
providerId: ann
created: '2026-05-04'
# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-04, not harvested from the provider. See roadmap#35.
method: generated
modified: '2026-05-05'
reconciled: false
tags:
  - Affiliate Marketing
  - Retail
  - Rate Limiting
description: >-
  Ann Taylor does not operate a first-party API and therefore publishes no
  rate-limit documentation. Affiliate publishers interact with the FlexOffers
  or CJ Affiliate API surface, whose rate limits are governed by those
  networks (not by Ann Taylor).
limit_count: 0
verified: '2026-09-02'
notes: >-
  Rate limits are governed by the affiliate network the publisher joins
  (FlexOffers / CJ), not by Ann Taylor. limit_count is an honest 0: re-checked
  2026-09-02, ANN Inc. publishes no numeric rate limit, no burst, no RateLimit-*
  / X-RateLimit-* / Retry-After response headers and no exhaustion status code,
  because it publishes no first-party API. The single limits[] entry below is a
  pointer at the network's documentation, not a published ANN Inc. limit.
sources:
  - https://www.flexoffers.com/affiliate-programs/ann-taylor-affiliate-program/
responseCodes: {}
limits:
  - name: Affiliate Network Limits Apply
    scope: account
    metric: varies
    limit: 'see FlexOffers / CJ Affiliate developer docs'
policies:
  - name: Network-Owned Throttling
    description: >-
      Catalog feeds, link generation, and reporting APIs are operated by the
      affiliate network. Rate-limit, retry, and 429 semantics live in the
      network's developer documentation.
maintainers:
  - FN: API Evangelist
    email: info@apievangelist.com
